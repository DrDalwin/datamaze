<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DATAMAZE Digital Magazine</title>


<!-- =====================================================
     PDF.JS
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =====================================================
     STPAGEFLIP 2.0.7
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   BACKGROUND
===================================================== */

body {

    background:

        radial-gradient(
            ellipse at center,
            #555 0%,
            #292929 45%,
            #080808 100%
        );

}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background:
        rgba(8,8,8,.96);

    color: white;

    position: relative;

    z-index: 100;

}


.logo {

    font-size: 19px;

    font-weight: 700;

    letter-spacing: .5px;

}


.status {

    font-size: 13px;

    color: #aaa;

}


/* =====================================================
   VIEWER
===================================================== */

.viewer {

    width: 100%;

    height:
        calc(100vh - 118px);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* =====================================================
   BOOK CONTAINER
===================================================== */

#book-container {

    position: relative;

    width: 92vw;

    max-width: 1250px;

    height: 88vh;

    max-height: 900px;

}


/* =====================================================
   PDF PAGE
===================================================== */

.magazine-page {

    position: relative;

    width: 100%;

    height: 100%;

    background: white;

    overflow: hidden;

}


/* =====================================================
   PDF CANVAS
===================================================== */

.magazine-page canvas {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    display: block;

}


/* =====================================================
   PAGE SHADOW
===================================================== */

.magazine-page::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,.14);

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    width: 100%;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    background:
        rgba(8,8,8,.96);

    position: relative;

    z-index: 100;

}


button {

    border: none;

    outline: none;

    background: #eeeeee;

    color: #111;

    padding:
        9px 17px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;

    transition:
        background .15s,
        transform .1s;

}


button:hover {

    background: white;

}


button:active {

    transform:
        scale(.97);

}


button:disabled {

    opacity: .35;

    cursor: default;

}


.page-info {

    min-width: 150px;

    text-align: center;

    color: #aaa;

    font-size: 13px;

}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.95);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 12px;

    z-index: 10000;

}


.loading-title {

    font-size: 22px;

    font-weight: bold;

}


.loading-text {

    font-size: 13px;

    color: #aaa;

}


/* =====================================================
   ERROR
===================================================== */

#error {

    display: none;

    max-width: 700px;

    padding: 30px;

    text-align: center;

    color: #ff7777;

    line-height: 1.6;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .header {

        height: 50px;

        padding: 0 12px;

    }


    .logo {

        font-size: 14px;

    }


    .status {

        font-size: 11px;

    }


    .viewer {

        height:
            calc(100vh - 110px);

    }


    #book-container {

        width: 96vw;

        height: 82vh;

    }


    .controls {

        height: 60px;

        gap: 4px;

    }


    button {

        padding:
            8px 10px;

        font-size: 11px;

    }


    .page-info {

        min-width: 90px;

        font-size: 11px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div id="loading">

    <div class="loading-title">

        📖 DATAMAZE

    </div>


    <div
        class="loading-text"
        id="loading-text">

        Loading magazine...

    </div>


    <div id="error"></div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">

        📖 DATAMAZE DIGITAL MAGAZINE

    </div>


    <div
        class="status"
        id="status">

        Preparing...

    </div>

</div>


<!-- =====================================================
     BOOK
===================================================== -->

<div class="viewer">

    <div id="book-container"></div>

</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button
        type="button"
        id="first">

        ⏮ First

    </button>


    <button
        type="button"
        id="previous">

        ◀ Previous

    </button>


    <div
        class="page-info"
        id="page-info">

        Cover

    </div>


    <button
        type="button"
        id="next">

        Next ▶

    </button>


    <button
        type="button"
        id="last">

        Last ⏭

    </button>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const PDF_FILE =
    "./datamaze.pdf";


const PAGE_WIDTH =
    595;


const PAGE_HEIGHT =
    842;


/* =====================================================
   PDF WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =

    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   VARIABLES
===================================================== */

let pdf = null;

let totalPages = 0;

let pageFlip = null;

let pageElements = [];


/* =====================================================
   DOM ELEMENTS
===================================================== */

const bookContainer =
    document.getElementById(
        "book-container"
    );


const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loading-text"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const status =
    document.getElementById(
        "status"
    );


const pageInfo =
    document.getElementById(
        "page-info"
    );


const firstButton =
    document.getElementById(
        "first"
    );


const previousButton =
    document.getElementById(
        "previous"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const lastButton =
    document.getElementById(
        "last"
    );


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    loadingText.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.innerHTML =

        "<strong>Unable to load DATAMAZE</strong>" +

        "<br><br>" +

        message +

        "<br><br>" +

        "Make sure <b>datamaze.pdf</b> is in the same folder as <b>index.html</b>.";

}


/* =====================================================
   CREATE PAGE
===================================================== */

function createPage() {

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "magazine-page";


    return page;

}


/* =====================================================
   RENDER PDF PAGE
===================================================== */

async function renderPDFPage(
    pageNumber,
    container
) {

    const pdfPage =
        await pdf.getPage(
            pageNumber
        );


    /*
       High-resolution render.
    */

    const viewport =
        pdfPage.getViewport({
            scale: 2
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    const context =
        canvas.getContext(
            "2d"
        );


    await pdfPage.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    canvas.style.width =
        "100%";


    canvas.style.height =
        "100%";


    container.appendChild(
        canvas
    );

}


/* =====================================================
   BUILD ALL PDF PAGES
===================================================== */

async function buildAllPages() {

    pageElements = [];


    for (
        let pageNumber = 1;
        pageNumber <= totalPages;
        pageNumber++
    ) {

        loadingText.innerText =

            "Rendering page " +
            pageNumber +
            " of " +
            totalPages +
            "...";


        const page =
            createPage();


        /*
           Cover.
        */

        if (
            pageNumber === 1
        ) {

            page.dataset.density =
                "hard";

        }


        /*
           Back cover.
        */

        if (
            pageNumber === totalPages
        ) {

            page.dataset.density =
                "hard";

        }


        /*
           Render PDF page.
        */

        await renderPDFPage(
            pageNumber,
            page
        );


        /*
           Add to complete book.
        */

        pageElements.push(
            page
        );


        status.innerText =

            "Loaded " +
            pageNumber +
            " / " +
            totalPages;

    }

}


/* =====================================================
   CREATE STPAGEFLIP
===================================================== */

function createPageFlip() {

    pageFlip =

        new St.PageFlip(

            bookContainer,

            {

                width:
                    PAGE_WIDTH,

                height:
                    PAGE_HEIGHT,


                size:
                    "stretch",


                minWidth:
                    280,

                maxWidth:
                    900,

                minHeight:
                    396,

                maxHeight:
                    1260,


                /*
                   Desktop book layout.
                */

                usePortrait:
                    false,


                /*
                   Cover alone.
                */

                showCover:
                    true,


                /*
                   Realistic shadows.
                */

                drawShadow:
                    true,

                maxShadowOpacity:
                    0.55,


                /*
                   Page turn duration.
                */

                flippingTime:
                    900,


                /*
                   Native touch/mouse.
                */

                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                /*
                   IMPORTANT:

                   Do NOT use

                   disableFlipByClick:true

                   because StPageFlip 2.0.7
                   has a known problem with
                   programmatic flipPrev()
                   in that configuration.
                */

                disableFlipByClick:
                    false,


                startPage:
                    0,


                autoSize:
                    true

            }

        );


    /*
       Load COMPLETE book.

       Nothing is rendered during
       page turning.
    */

    pageFlip.loadFromHTML(
        pageElements
    );


    /* =================================================
       PAGE FLIP EVENT
    ================================================= */

    pageFlip.on(
        "flip",
        function(event) {

            updatePageInfo(
                event.data
            );

            updateButtons();

        }
    );


    /* =================================================
       STATE EVENT
    ================================================= */

    pageFlip.on(
        "changeState",
        function() {

            updateButtons();

        }
    );


    updatePageInfo(0);

}


/* =====================================================
   UPDATE PAGE INFORMATION
===================================================== */

function updatePageInfo(
    current
) {

    if (
        current === 0
    ) {

        pageInfo.innerText =
            "Cover";

        status.innerText =
            "Cover";

        return;

    }


    const left =
        current;


    const right =
        current + 1;


    if (
        right <= totalPages
    ) {

        pageInfo.innerText =

            "Pages " +
            left +
            " – " +
            right;

    }

    else {

        pageInfo.innerText =

            "Page " +
            left;

    }


    status.innerText =

        "Page " +
        current +
        " / " +
        totalPages;

}


/* =====================================================
   BUTTON STATE
===================================================== */

function updateButtons() {

    if (!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    /*
       Do not disable buttons based
       on flipping state.

       StPageFlip itself handles
       the animation state.
    */

    firstButton.disabled =
        current <= 0;


    previousButton.disabled =
        current <= 0;


    nextButton.disabled =
        current >=
        totalPages - 1;


    lastButton.disabled =
        current >=
        totalPages - 1;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        const current =
            pageFlip.getCurrentPageIndex();


        if (
            current >=
            totalPages - 1
        ) {

            return;

        }


        /*
           StPageFlip official
           animated next method.
        */

        pageFlip.flipNext(
            "bottom"
        );

    }
);


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

previousButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        const current =
            pageFlip.getCurrentPageIndex();


        console.log(
            "Previous clicked. Current page:",
            current
        );


        if (
            current <= 0
        ) {

            return;

        }


        /*
           IMPORTANT:

           This is the official
           animated previous-page API.

           No DOM manipulation.
           No PDF rendering.
           No page replacement.
        */

        pageFlip.flipPrev(
            "top"
        );

    }
);


/* =====================================================
   FIRST BUTTON
===================================================== */

firstButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        pageFlip.turnToPage(
            0
        );

    }
);


/* =====================================================
   LAST BUTTON
===================================================== */

lastButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        pageFlip.turnToPage(
            totalPages - 1
        );

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!pageFlip)
            return;


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            const current =
                pageFlip.getCurrentPageIndex();


            if (
                current <
                totalPages - 1
            ) {

                pageFlip.flipNext(
                    "bottom"
                );

            }

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            const current =
                pageFlip.getCurrentPageIndex();


            if (
                current > 0
            ) {

                pageFlip.flipPrev(
                    "top"
                );

            }

        }

    }
);


/* =====================================================
   LOAD PDF
===================================================== */

async function start() {

    try {

        loadingText.innerText =
            "Opening PDF...";


        /*
           Load PDF.
        */

        pdf =
            await pdfjsLib
                .getDocument({
                    url:
                        PDF_FILE
                })
                .promise;


        totalPages =
            pdf.numPages;


        if (
            totalPages < 1
        ) {

            throw new Error(
                "The PDF contains no pages."
            );

        }


        /*
           Render ALL pages first.

           This is important for the
           realistic page underneath
           the flipping page.
        */

        await buildAllPages();


        loadingText.innerText =
            "Preparing book...";


        /*
           Allow browser to paint
           all canvases.
        */

        await new Promise(
            function(resolve) {

                requestAnimationFrame(
                    function() {

                        requestAnimationFrame(
                            resolve
                        );

                    }
                );

            }
        );


        /*
           Create the book.
        */

        createPageFlip();


        /*
           Hide loading.
        */

        loading.style.display =
            "none";


        updateButtons();

    }

    catch(error) {

        console.error(
            error
        );


        showError(
            error.message
        );

    }

}


/* =====================================================
   START
===================================================== */

start();

</script>

</body>

</html>
