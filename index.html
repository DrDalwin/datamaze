<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DATAMAZE Digital Magazine</title>


<!-- =====================================================
     PDF.JS
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =====================================================
     STPAGEFLIP
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   BACKGROUND
===================================================== */

body {

    background:
        radial-gradient(
            ellipse at center,
            #555 0%,
            #292929 45%,
            #080808 100%
        );

}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background:
        rgba(8,8,8,.97);

    color: white;

    position: relative;

    z-index: 100;

}


.logo {

    font-size: 19px;

    font-weight: 700;

    letter-spacing: .5px;

}


.status {

    font-size: 13px;

    color: #aaa;

}


/* =====================================================
   VIEWER
===================================================== */

.viewer {

    width: 100%;

    height:
        calc(100vh - 118px);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* =====================================================
   BOOK CONTAINER
===================================================== */

#book-container {

    position: relative;

    width: 92vw;

    max-width: 1250px;

    height: 88vh;

    max-height: 900px;

}


/* =====================================================
   PAGE
===================================================== */

.magazine-page {

    position: relative;

    width: 100%;

    height: 100%;

    background: white;

    overflow: hidden;

}


/* =====================================================
   PDF CANVAS
===================================================== */

.magazine-page canvas {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    display: block;

}


/* =====================================================
   PAGE INNER SHADOW
===================================================== */

.magazine-page::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,.14);

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    width: 100%;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    background:
        rgba(8,8,8,.97);

    position: relative;

    z-index: 100;

}


button {

    border: none;

    outline: none;

    background: #eeeeee;

    color: #111;

    padding:
        9px 17px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;

    transition:
        background .15s,
        transform .1s;

}


button:hover {

    background: white;

}


button:active {

    transform:
        scale(.97);

}


button:disabled {

    opacity: .35;

    cursor: default;

}


.page-info {

    min-width: 150px;

    text-align: center;

    color: #aaa;

    font-size: 13px;

}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.96);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 12px;

    z-index: 10000;

}


.loading-title {

    font-size: 24px;

    font-weight: 700;

}


.loading-text {

    font-size: 14px;

    color: #aaa;

    text-align: center;

    padding: 0 20px;

}


/* =====================================================
   ERROR
===================================================== */

#error {

    display: none;

    width: min(750px, 90vw);

    padding: 25px;

    text-align: center;

    color: #ff7777;

    line-height: 1.6;

    background:
        rgba(40,0,0,.35);

    border:
        1px solid rgba(255,100,100,.3);

    border-radius: 8px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .header {

        height: 50px;

        padding: 0 12px;

    }


    .logo {

        font-size: 14px;

    }


    .status {

        font-size: 11px;

    }


    .viewer {

        height:
            calc(100vh - 110px);

    }


    #book-container {

        width: 96vw;

        height: 82vh;

    }


    .controls {

        height: 60px;

        gap: 4px;

    }


    button {

        padding:
            8px 10px;

        font-size: 11px;

    }


    .page-info {

        min-width: 90px;

        font-size: 11px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div id="loading">

    <div class="loading-title">

        📖 DATAMAZE

    </div>


    <div
        class="loading-text"
        id="loading-text">

        Connecting to magazine...

    </div>


    <div id="error"></div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">

        📖 DATAMAZE DIGITAL MAGAZINE

    </div>


    <div
        class="status"
        id="status">

        Preparing...

    </div>

</div>


<!-- =====================================================
     BOOK
===================================================== -->

<div class="viewer">

    <div id="book-container"></div>

</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button
        type="button"
        id="first">

        ⏮ First

    </button>


    <button
        type="button"
        id="previous">

        ◀ Previous

    </button>


    <div
        class="page-info"
        id="page-info">

        Cover

    </div>


    <button
        type="button"
        id="next">

        Next ▶

    </button>


    <button
        type="button"
        id="last">

        Last ⏭

    </button>

</div>



<script>

/* =====================================================
   CONFIGURATION
===================================================== */

/*
   IMPORTANT:

   index.html and datamaze.pdf
   must be in the SAME GitHub
   Pages folder.
*/

const PDF_FILE =
    "./datamaze.pdf";


/*
   A4 portrait dimensions.
*/

const PAGE_WIDTH =
    595;


const PAGE_HEIGHT =
    842;


/* =====================================================
   PDF.JS WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =

    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let pdf = null;

let totalPages = 0;

let pageFlip = null;

let pageElements = [];


/* =====================================================
   DOM ELEMENTS
===================================================== */

const bookContainer =
    document.getElementById(
        "book-container"
    );


const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loading-text"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const status =
    document.getElementById(
        "status"
    );


const pageInfo =
    document.getElementById(
        "page-info"
    );


const firstButton =
    document.getElementById(
        "first"
    );


const previousButton =
    document.getElementById(
        "previous"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const lastButton =
    document.getElementById(
        "last"
    );


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

    loadingText.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.innerHTML =
        message;

}


/* =====================================================
   LOAD PDF FROM GITHUB
===================================================== */

async function loadPDF() {

    loadingText.innerText =
        "Downloading magazine...";


    /*
       Fetch the PDF ourselves.

       This lets us check exactly
       what GitHub returned.
    */

    const response =
        await fetch(
            PDF_FILE,
            {
                method: "GET",

                cache: "no-cache"
            }
        );


    /*
       Check HTTP response.
    */

    if (!response.ok) {

        throw new Error(

            "PDF download failed.<br><br>" +

            "HTTP Status: " +
            response.status +
            "<br><br>" +

            "Requested file:<br>" +
            PDF_FILE

        );

    }


    /*
       Get binary PDF data.
    */

    const pdfData =
        await response.arrayBuffer();


    console.log(
        "Downloaded PDF size:",
        pdfData.byteLength,
        "bytes"
    );


    /*
       Check that the file isn't
       suspiciously small.
    */

    if (
        pdfData.byteLength < 100
    ) {

        throw new Error(

            "The file downloaded from GitHub is too small to be a valid PDF.<br><br>" +

            "Downloaded size: " +
            pdfData.byteLength +
            " bytes<br><br>" +

            "Check that <b>datamaze.pdf</b> was uploaded correctly."

        );

    }


    /*
       Check PDF signature.

       Valid PDFs normally begin:

       %PDF-
    */

    const headerBytes =
        new Uint8Array(
            pdfData.slice(
                0,
                5
            )
        );


    const header =
        new TextDecoder()
            .decode(
                headerBytes
            );


    console.log(
        "PDF header:",
        header
    );


    /*
       If GitHub returns HTML,
       the header will NOT be %PDF-.
    */

    if (
        header !== "%PDF-"
    ) {

        throw new Error(

            "GitHub did not return a valid PDF file.<br><br>" +

            "Received header: <b>" +
            header.replace(
                /</g,
                "&lt;"
            ) +
            "</b><br><br>" +

            "Expected: <b>%PDF-</b><br><br>" +

            "Check the filename and GitHub Pages path."

        );

    }


    loadingText.innerText =
        "Opening PDF...";


    /*
       Give binary data directly
       to PDF.js.
    */

    pdf =
        await pdfjsLib
            .getDocument({
                data:
                    pdfData
            })
            .promise;


    totalPages =
        pdf.numPages;


    console.log(
        "PDF pages:",
        totalPages
    );


    if (
        totalPages < 1
    ) {

        throw new Error(
            "The PDF contains no pages."
        );

    }

}


/* =====================================================
   CREATE PAGE
===================================================== */

function createPage() {

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "magazine-page";


    return page;

}


/* =====================================================
   RENDER PDF PAGE
===================================================== */

async function renderPDFPage(
    pageNumber,
    container
) {

    const pdfPage =
        await pdf.getPage(
            pageNumber
        );


    /*
       High resolution.

       Change 2 to 1.5 if the
       magazine has many pages
       and loading is slow.
    */

    const viewport =
        pdfPage.getViewport({
            scale: 2
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    const context =
        canvas.getContext(
            "2d"
        );


    await pdfPage.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    canvas.style.width =
        "100%";


    canvas.style.height =
        "100%";


    container.appendChild(
        canvas
    );

}


/* =====================================================
   BUILD COMPLETE BOOK
===================================================== */

async function buildAllPages() {

    pageElements = [];


    for (
        let pageNumber = 1;

        pageNumber <= totalPages;

        pageNumber++
    ) {

        loadingText.innerText =

            "Rendering page " +
            pageNumber +
            " of " +
            totalPages +
            "...";


        const page =
            createPage();


        /*
           Cover.
        */

        if (
            pageNumber === 1
        ) {

            page.dataset.density =
                "hard";

        }


        /*
           Back cover.
        */

        if (
            pageNumber === totalPages
        ) {

            page.dataset.density =
                "hard";

        }


        /*
           Render PDF page.
        */

        await renderPDFPage(
            pageNumber,
            page
        );


        /*
           Store complete page.
        */

        pageElements.push(
            page
        );


        status.innerText =

            "Loaded " +
            pageNumber +
            " / " +
            totalPages;

    }

}


/* =====================================================
   CREATE PAGE FLIP
===================================================== */

function createPageFlip() {

    pageFlip =
        new St.PageFlip(

            bookContainer,

            {

                width:
                    PAGE_WIDTH,

                height:
                    PAGE_HEIGHT,


                size:
                    "stretch",


                minWidth:
                    280,

                maxWidth:
                    900,

                minHeight:
                    396,

                maxHeight:
                    1260,


                /*
                   Desktop two-page book.
                */

                usePortrait:
                    false,


                /*
                   Cover alone.
                */

                showCover:
                    true,


                /*
                   Realistic shadow.
                */

                drawShadow:
                    true,

                maxShadowOpacity:
                    0.55,


                /*
                   Page animation.
                */

                flippingTime:
                    900,


                /*
                   Native touch.
                */

                useMouseEvents:
                    true,


                mobileScrollSupport:
                    false,


                /*
                   IMPORTANT:

                   false allows flipPrev()
                   to work correctly with
                   StPageFlip 2.0.7.
                */

                disableFlipByClick:
                    false,


                startPage:
                    0,


                autoSize:
                    true

            }

        );


    /*
       Load the COMPLETE book.
    */

    pageFlip.loadFromHTML(
        pageElements
    );


    /* =================================================
       FLIP EVENT
    ================================================= */

    pageFlip.on(
        "flip",
        function(event) {

            updatePageInfo(
                event.data
            );

            updateButtons();

        }
    );


    /* =================================================
       STATE EVENT
    ================================================= */

    pageFlip.on(
        "changeState",
        function() {

            updateButtons();

        }
    );


    updatePageInfo(0);

}


/* =====================================================
   UPDATE PAGE INFO
===================================================== */

function updatePageInfo(
    current
) {

    if (
        current === 0
    ) {

        pageInfo.innerText =
            "Cover";

        status.innerText =
            "Cover";

        return;

    }


    const left =
        current;


    const right =
        current + 1;


    if (
        right <= totalPages
    ) {

        pageInfo.innerText =

            "Pages " +
            left +
            " – " +
            right;

    }

    else {

        pageInfo.innerText =

            "Page " +
            left;

    }


    status.innerText =

        "Page " +
        current +
        " / " +
        totalPages;

}


/* =====================================================
   UPDATE BUTTONS
===================================================== */

function updateButtons() {

    if (!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    firstButton.disabled =
        current <= 0;


    previousButton.disabled =
        current <= 0;


    nextButton.disabled =
        current >=
        totalPages - 1;


    lastButton.disabled =
        current >=
        totalPages - 1;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        const current =
            pageFlip.getCurrentPageIndex();


        if (
            current >=
            totalPages - 1
        ) {

            return;

        }


        /*
           Animated forward turn.
        */

        pageFlip.flipNext(
            "bottom"
        );

    }
);


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

previousButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        const current =
            pageFlip.getCurrentPageIndex();


        console.log(
            "Previous clicked:",
            current
        );


        if (
            current <= 0
        ) {

            return;

        }


        /*
           Animated reverse turn.
        */

        pageFlip.flipPrev(
            "top"
        );

    }
);


/* =====================================================
   FIRST
===================================================== */

firstButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        pageFlip.turnToPage(
            0
        );

    }
);


/* =====================================================
   LAST
===================================================== */

lastButton.addEventListener(
    "click",
    function() {

        if (!pageFlip)
            return;


        pageFlip.turnToPage(
            totalPages - 1
        );

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!pageFlip)
            return;


        /*
           NEXT
        */

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            const current =
                pageFlip.getCurrentPageIndex();


            if (
                current <
                totalPages - 1
            ) {

                pageFlip.flipNext(
                    "bottom"
                );

            }

        }


        /*
           PREVIOUS
        */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            const current =
                pageFlip.getCurrentPageIndex();


            if (
                current > 0
            ) {

                pageFlip.flipPrev(
                    "top"
                );

            }

        }

    }
);


/* =====================================================
   START APPLICATION
===================================================== */

async function start() {

    try {

        /*
           STEP 1
           Download and validate PDF.
        */

        await loadPDF();


        /*
           STEP 2
           Render every page.
        */

        await buildAllPages();


        /*
           STEP 3
           Let browser paint canvases.
        */

        loadingText.innerText =
            "Preparing 3D book...";


        await new Promise(
            function(resolve) {

                requestAnimationFrame(
                    function() {

                        requestAnimationFrame(
                            resolve
                        );

                    }
                );

            }
        );


        /*
           STEP 4
           Create physical book.
        */

        createPageFlip();


        /*
           STEP 5
           Show book.
        */

        loading.style.display =
            "none";


        updateButtons();

    }

    catch(error) {

        console.error(
            "DATAMAZE ERROR:",
            error
        );


        showError(

            "<strong>Unable to load DATAMAZE</strong>" +

            "<br><br>" +

            error.message +

            "<br><br>" +

            "Make sure <b>datamaze.pdf</b> is in the same folder as <b>index.html</b>."

        );

    }

}


/* =====================================================
   START
===================================================== */

start();

</script>

</body>

</html>
